[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lng-ticket-assistant"
version = "0.1.0"
description = "Simple agent for automatically solving common questions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.115",
    "huggingface-hub>=1.30.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "lancedb>=0.38.0",
    "langchain-google-genai>=4.4.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "peft>=0.20.0",
    "pillow>=12.1.1",
    "pyarrow>=25.0.1",
    "pymupdf>=1.26.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.1.1",
    "ray>=2.58.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "uvicorn>=0.34",
]

[project.scripts]
lng-ticket-web = "lng_ticket_assistant.web:main"
lng-ticket-assistant = "lng_ticket_assistant.main:main"
lng-ticket-preprocess = "lng_ticket_assistant.preprocess:main"
lng-ticket-rebuild-embeddings = "lng_ticket_assistant.rebuild_embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28",
]
